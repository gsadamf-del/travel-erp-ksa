name: CI - Build Backend and Flutter

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  backend-build:
    name: Build Backend (ASP.NET Core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      - name: Restore NuGet packages
        run: dotnet restore ./backend

      - name: Build
        run: dotnet build --configuration Release ./backend

      - name: Publish
        run: dotnet publish -c Release -o ./artifacts/backend ./backend

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: ./artifacts/backend

  flutter-android:
    name: Build Flutter APK (Android - release unsigned)
    runs-on: ubuntu-latest
    needs: backend-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.5'

      - name: Create Flutter project if missing
        run: |
          if [ ! -f frontend/pubspec.yaml ]; then
            flutter create --org com.travel --project-name erp frontend
          fi

      - name: Flutter pub get
        run: flutter pub get
        working-directory: ./frontend

      - name: Build release APK unsigned (versionName=v5 versionCode=5)
        run: flutter build apk --release --no-shrink --build-name=v5 --build-number=5
        working-directory: ./frontend

      - name: Rename and upload unsigned APK artifact
        run: |
          mkdir -p ./artifacts
          cp frontend/build/app/outputs/flutter-apk/app-release.apk ./artifacts/app-release-unsigned.apk || true
        
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-apk
          path: ./artifacts/app-release-unsigned.apk

  flutter-windows:
    name: Build Flutter Windows (debug)
    runs-on: windows-latest
    needs: backend-build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.10.5'

      - name: Create Flutter project if missing
        run: |
          if (-Not (Test-Path frontend\\pubspec.yaml)) { flutter create --org com.travel --project-name erp frontend }

      - name: Flutter pub get
        run: flutter pub get
        working-directory: ./frontend

      - name: Build Windows (debug)
        run: flutter build windows --debug
        working-directory: ./frontend

      - name: Zip Windows build
        run: |
          powershell -Command "Compress-Archive -Path frontend\\build\\windows\\runner\\Debug\\* -DestinationPath windows-build.zip"

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-windows-debug
          path: windows-build.zip
